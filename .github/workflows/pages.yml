name: Deploy ProPharm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v6

      - name: Unpack ProPharm
        run: |
          rm -rf site
          mkdir site
          rm -rf /tmp/propharm
          mkdir /tmp/propharm

          unzip -q PharmExam170_PWA_v0_2.zip -d /tmp/propharm

          cp -R /tmp/propharm/PharmExam170_PWA_v0_2/. site/

          echo "Published files:"
          find site -maxdepth 2 -type f | sort | head -100

          test -f site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
