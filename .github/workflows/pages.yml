name: Deploy ProPharm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Unpack latest ProPharm
        shell: bash
        run: |
          set -e

          rm -rf site
          rm -rf /tmp/propharm

          mkdir -p site
          mkdir -p /tmp/propharm

          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'PharmExam170_PWA_v*.zip' -printf '%f\n' | sort -V | tail -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: PharmExam ZIP not found"
            exit 1
          fi

          FOLDER_NAME="${ZIP_FILE%.zip}"

          echo "Using ZIP: $ZIP_FILE"
          echo "Expected folder: $FOLDER_NAME"

          unzip -q "$ZIP_FILE" -d /tmp/propharm

          echo "Extracted files:"
          find /tmp/propharm -maxdepth 2 -type f | sort | head -100

          cp -R "/tmp/propharm/$FOLDER_NAME/." site/

          echo "Site files:"
          find site -maxdepth 2 -type f | sort | head -100

          test -f site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
