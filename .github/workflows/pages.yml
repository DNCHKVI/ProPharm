name: Deploy ProPharm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Unpack public release
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="ProPharm_v0.28.3_GITHUB_PAGES.zip"
          test -f "$ZIP_FILE" || { echo "Upload $ZIP_FILE to the repository root first"; exit 1; }
          rm -rf site
          mkdir site
          unzip -q "$ZIP_FILE" -d site
          test -f site/index.html
          test -f site/src/core/build.js
          test -f site/asset-manifest.json
          test ! -d site/server-bundle
          test ! -d site/content
          test ! -d site/supabase
          echo "Publishing $ZIP_FILE"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
